name: Expire Pending Bookings

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger booking auto-expiry
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set SITE_URL and CRON_SECRET repository secrets to enable this job."
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/expire-pending")
          echo "HTTP $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ]